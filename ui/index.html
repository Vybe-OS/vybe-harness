<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6f6e68; --line: #e3e1da;
    --accent: #c15f3c; --accent-ink: #ffffff; --user: #efeadf; --code: #f0eee8;
    --add-bg: #e6f4ea; --add-ink: #14532d; --del-bg: #fdeaea; --del-ink: #7f1d1d; --hunk: #6b5fb5;
    --warn: #b45309; --ok: #15803d;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a18; --panel: #242321; --ink: #ecebe6; --muted: #9a988f; --line: #38362f;
      --accent: #d97757; --accent-ink: #1b1a18; --user: #302d27; --code: #2c2a26;
      --add-bg: #17301f; --add-ink: #8fe0a8; --del-bg: #3a1c1c; --del-ink: #f2a3a3; --hunk: #a99df0;
      --warn: #f0b35a; --ok: #6fd18f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  header .title { font-weight: 650; letter-spacing: .2px; }
  header .root { color: var(--muted); font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 80px; direction: rtl; text-align: left; }
  .pill {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px;
    padding: 4px 12px; font: 12.5px var(--sans); cursor: pointer;
  }
  .pill:hover { border-color: var(--accent); }
  .pill.plan { color: var(--warn); border-color: var(--warn); }
  .pill.build { color: var(--ok); border-color: var(--ok); }
  .pill:disabled { opacity: .5; cursor: not-allowed; }
  #log { flex: 1; overflow-y: auto; padding: 20px 16px 8px; }
  .col { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); padding: 8px 14px; border-radius: 14px 14px 4px 14px; max-width: 85%; }
  .msg.assistant { padding: 2px 2px; }
  .msg.info { color: var(--muted); font-size: 13px; text-align: center; }
  .msg.error { color: var(--del-ink); background: var(--del-bg); padding: 8px 12px; border-radius: 8px; font-size: 13.5px; }
  .msg code { font-family: var(--mono); font-size: .9em; background: var(--code); padding: 1px 5px; border-radius: 4px; }
  .msg pre { font-family: var(--mono); font-size: 13px; background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 6px 0; white-space: pre; }
  .msg pre code { background: none; padding: 0; }
  .tool {
    font: 12.5px var(--mono); color: var(--muted); border: 1px solid var(--line); background: var(--panel);
    padding: 5px 10px; border-radius: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tool b { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .cmd { font: 13px var(--mono); background: #151515; color: #e8e8e8; padding: 8px 12px; border-radius: 8px; overflow-x: auto; white-space: pre; }
  .cmd::before { content: "$ "; color: #7bd88f; }
  .diff { font: 12.5px/1.45 var(--mono); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .diff .l { padding: 0 10px; white-space: pre; overflow-x: auto; }
  .diff .add { background: var(--add-bg); color: var(--add-ink); }
  .diff .del { background: var(--del-bg); color: var(--del-ink); }
  .diff .hunk { color: var(--hunk); background: var(--code); }
  .diff .head { color: var(--muted); }
  .confirm { border: 1px solid var(--accent); border-radius: 10px; padding: 10px 14px; background: var(--panel); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .confirm .q { flex: 1; min-width: 160px; }
  .confirm.done { border-color: var(--line); color: var(--muted); }
  button.btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 6px 14px; font: 14px var(--sans); cursor: pointer; }
  button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.btn:hover { filter: brightness(1.06); }
  #working { color: var(--muted); font-size: 13px; display: none; }
  #working.on { display: block; }
  #working span { display: inline-block; animation: blink 1.2s infinite; }
  #working span:nth-child(2) { animation-delay: .2s; } #working span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  footer { padding: 10px 16px 16px; }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
  .composer:focus-within { border-color: var(--accent); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font: 15px/1.5 var(--sans); max-height: 180px; padding: 6px 8px; }
  .hint { max-width: 820px; margin: 6px auto 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <span class="title">agent</span>
  <span class="root" id="root" title=""></span>
  <button class="pill" id="model" title="Switch model">model</button>
  <button class="pill" id="mode" title="Toggle build / plan">mode</button>
  <button class="pill" id="clear" title="Start a new session">New session</button>
</header>

<div id="log"><div class="col" id="col"><div id="working">working<span>.</span><span>.</span><span>.</span></div></div></div>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask the agent to do something in this folder…" autofocus></textarea>
    <button class="btn primary" id="send">Send</button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for a new line · edits and commands always ask before running</div>
</footer>

<script>
const token = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
const col = $("col"), log = $("log"), working = $("working"), input = $("input"), sendBtn = $("send");
let since = 0, busy = false, pending = null, stick = true, mode = "build", model = "";

log.addEventListener("scroll", () => { stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80; });

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "X-Token": token, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok && r.status !== 409) throw new Error(r.status);
  return r.json();
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

// tiny markdown: fenced code, inline code, bold
function md(text) {
  return text.split(/```/).map((part, i) => {
    if (i % 2) { return "<pre><code>" + esc(part.replace(/^[^\n]*\n/, "")) + "</code></pre>"; }
    return esc(part).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  }).join("");
}

function add(el) {
  col.insertBefore(el, working);
  if (stick) log.scrollTop = log.scrollHeight;
}
function mk(cls, html) { const d = document.createElement("div"); d.className = cls; if (html !== undefined) d.innerHTML = html; return d; }

function resolvePending(label) {
  if (!pending) return;
  pending.classList.add("done");
  pending.querySelector(".q").textContent = label || pending.querySelector(".q").textContent;
  pending.querySelectorAll("button").forEach((b) => b.remove());
  pending = null;
}

function answer(a, label) {
  resolvePending(label);
  api("/answer", { answer: a }).catch(() => {});
}

function render(ev) {
  if (ev.kind !== "confirm" && ev.kind !== "status") resolvePending();
  switch (ev.kind) {
    case "user": add(mk("msg user", esc(ev.text))); break;
    case "assistant": add(mk("msg assistant", md(ev.text))); break;
    case "info": add(mk("msg info", esc(ev.text))); break;
    case "error": add(mk("msg error", esc(ev.text))); break;
    case "tool": {
      const [name, ...rest] = ev.text.split(" ");
      add(mk("tool", "<b>" + esc(name) + "</b>" + esc(rest.join(" ")))); break;
    }
    case "cmd": add(mk("cmd", esc(ev.text))); break;
    case "diff": {
      const d = mk("diff");
      ev.text.split("\n").forEach((line) => {
        const c = line.startsWith("+++") || line.startsWith("---") ? "head"
          : line.startsWith("@@") ? "hunk" : line.startsWith("+") ? "add" : line.startsWith("-") ? "del" : "";
        d.appendChild(mk("l " + c, esc(line) || " "));
      });
      add(d); break;
    }
    case "confirm": {
      const label = { write: "Write this file?", edit: "Apply this edit?", bash: "Run this command?" }[ev.text] || ("Allow " + ev.text + "?");
      const c = mk("confirm");
      c.innerHTML = '<span class="q">' + esc(label) + "</span>";
      [["Allow", "y", "primary", "Allowed"], ["Always this session", "a", "", "Always allowed"], ["Deny", "n", "", "Denied"]].forEach(([t, v, cls, done]) => {
        const b = document.createElement("button");
        b.className = "btn " + cls; b.textContent = t;
        b.onclick = () => answer(v, label + " — " + done);
        c.appendChild(b);
      });
      add(c); pending = c; break;
    }
    case "status":
      mode = ev.mode; model = ev.model;
      $("mode").textContent = ev.mode; $("mode").className = "pill " + ev.mode;
      $("model").textContent = ev.model;
      $("root").textContent = "\u202A" + ev.root; $("root").title = ev.root;
      document.title = "agent · " + ev.root.split(/[\\/]/).pop();
      break;
  }
}

function setBusy(b) {
  busy = b;
  working.classList.toggle("on", b && !pending);
  sendBtn.disabled = b; $("mode").disabled = b; $("clear").disabled = b; $("model").disabled = b;
  if (b && stick) log.scrollTop = log.scrollHeight;
}

async function poll() {
  try {
    const r = await api("/events?since=" + since);
    since = r.next;
    r.events.forEach(render);
    setBusy(r.busy);
  } catch (e) { /* server restarting or gone; keep trying */ }
  setTimeout(poll, 350);
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  const r = await api("/send", { text });
  if (r.error === "busy") return;
  setBusy(true);
}

sendBtn.onclick = () => { send(input.value); input.value = ""; fit(); };
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendBtn.click(); }
});
function fit() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
input.addEventListener("input", fit);

$("mode").onclick = () => send("/mode");
$("clear").onclick = () => { if (confirm("Start a new session? The current conversation will be cleared.")) send("/clear"); };
$("model").onclick = () => { const m = prompt("Model id:", model); if (m && m.trim()) send("/model " + m.trim()); };

poll();
</script>
</body>
</html>
