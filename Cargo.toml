[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
walkdir = "2"
globset = "0.4"
similar = "2"
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true
strip = true
